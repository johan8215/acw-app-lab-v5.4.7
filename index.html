<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ACW‑App | Allston Car Wash</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="512x512" href="acw-icon-512.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" id="login">
    <h1>ALLSTON CAR WASH</h1>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="signInBtn" onclick="loginUser()">Sign In</button>
    <p id="diag" class="error"></p>
    <footer class="hud">
      Powered by JAG15 | Allston Car Wash © 2025<br>
      <span id="versionLabel">v5.6.3 — Blue Glass White Connected</span>
    </footer>
  </div>

  <div class="container" id="welcome" style="display:none;">
    <h1 id="welcomeName">Welcome</h1>
    <div id="welcomeRole" style="opacity:.7; margin-bottom:8px;"></div>
    <div id="schedule"></div>
    <button class="download-btn" onclick="openHistoryFor(currentUser?.email, currentUser?.name)">📚 My History (5w)</button>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal" style="display:none;">
    <div class="modal-content glass">
      <span class="close" onclick="closeSettings()">×</span>
      <h3>Settings</h3>
      <div class="settings-section">
        <button onclick="openHistoryFor(currentUser?.email, currentUser?.name)">📚 Open My History (5w)</button>
        <button id="changePassBtn" onclick="openChangePassword()">🔐 Change Password</button>
        <button onclick="refreshApp()">🧼 Update / Clear Cache</button>
        <button onclick="logoutUser()">👋 Logout</button>
      </div>
    </div>
  </div>

  <button class="gear-btn" aria-label="Settings" onclick="openSettings()">⚙️</button>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    // Register the service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(()=>{});
      });
    }
    // Show version in footer
    (function(){
      const v = (window.CONFIG && CONFIG.VERSION) || 'v5.6.3';
      const el = document.getElementById('versionLabel');
      if (el) el.textContent = v;
    })();
  </script>
</body>
</html>
